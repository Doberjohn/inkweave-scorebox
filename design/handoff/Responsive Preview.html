<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Responsive preview — Lorcana Scorebox</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  body {
    margin: 0;
    padding: 32px;
    background: var(--c-bg);
    color: var(--c-text);
    font-family: var(--font-body);
  }
  .preview-row {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .device {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .label {
    font-size: 12px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--c-text-muted);
    font-weight: 600;
  }
  .label small { color: var(--c-text-dim); margin-left: 6px; letter-spacing: 0.4px; text-transform: none; font-weight: 400; }
  .frame {
    border: 1px solid var(--c-surface-border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    background: var(--c-bg);
  }
  iframe {
    border: 0;
    display: block;
    background: var(--c-bg);
  }
  .frame-desktop { width: 1280px; }
  .frame-desktop iframe { width: 1280px; height: 820px; }

  .frame-tablet { width: 820px; }
  .frame-tablet iframe { width: 820px; height: 1100px; }

  .frame-mobile { width: 390px; }
  .frame-mobile iframe { width: 390px; height: 800px; }

  h1 {
    font-family: var(--font-hero);
    font-size: 28px;
    margin: 0 0 6px;
    color: var(--c-text);
    text-align: center;
  }
  .sub {
    text-align: center;
    color: var(--c-text-muted);
    margin-bottom: 30px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Responsive preview</h1>
  <div class="sub">Scorebox.html at three viewport widths</div>

  <div class="preview-row">
    <div class="device">
      <span class="label">Desktop <small>1280 × 820</small></span>
      <div class="frame frame-desktop"><iframe src="Scorebox.html"></iframe></div>
    </div>
    <div class="device">
      <span class="label">Tablet <small>820 × 1100</small></span>
      <div class="frame frame-tablet"><iframe src="Scorebox.html"></iframe></div>
    </div>
    <div class="device">
      <span class="label">Mobile <small>390 × 800</small></span>
      <div class="frame frame-mobile"><iframe src="Scorebox.html"></iframe></div>
    </div>
  </div>
</body>
</html>
